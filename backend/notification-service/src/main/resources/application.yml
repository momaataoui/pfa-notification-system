server:
  port: 8080

spring:
  application:
    name: notification-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/rexel-realm    

  datasource:
    url: jdbc:postgresql://localhost:5433/pfa_notifications
    username: pfa
    password: pfa

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.pfa.rexel.notification.event"
        spring.json.value.default.type: com.pfa.rexel.notification.event.RexelEvent
        spring.json.use.type.headers: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# Sans ceci, axon-spring-boot-starter essaie par defaut de se connecter a un
# serveur Axon Server distant (localhost:8124) pour router les commandes et
# stocker les events. On ne veut pas de serveur separe (decision actee) :
# desactiver Axon Server bascule automatiquement Axon sur un event store JPA
# local (tables domain_event_entry/token_entry, creees via ddl-auto: update).
axon:
  axonserver:
    enabled: false
  eventhandling:
    processors:
      # Par defaut, Axon traite les events de facon ASYNCHRONE (TrackingEventProcessor,
      # thread dedie qui relit l'event store). Ca cree une course : sendAndWait() peut
      # revenir avant que NotificationProjection ait consomme l'event. "subscribing"
      # traite l'event de facon SYNCHRONE, dans le meme thread que la commande -
      # coherent pour une appli mono-instance, pas besoin du mode distribue/replay.
      notification-projection:
        mode: subscribing


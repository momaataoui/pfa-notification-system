name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  notification-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -q compile
        working-directory: backend/notification-service

  rexel-mini-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -q compile
        working-directory: backend/rexel-mini-store

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: frontend/rexel-mini-store-frontend
      - run: npm run build
        working-directory: frontend/rexel-mini-store-frontend

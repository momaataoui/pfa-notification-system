<div class="relative">
  <svg
    #svgEl
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    class="w-full"
    (mousemove)="onMouseMove($event)"
    (mouseleave)="onMouseLeave()">

    <line
      *ngFor="let tick of yTicks"
      [attr.x1]="paddingLeft" [attr.x2]="width - paddingRight"
      [attr.y1]="yFor(tick)" [attr.y2]="yFor(tick)"
      class="stroke-gray-200 dark:stroke-neutral-800" stroke-width="1" />
    <text
      *ngFor="let tick of yTicks"
      [attr.x]="paddingLeft - 6" [attr.y]="yFor(tick) + 3"
      text-anchor="end" class="fill-gray-400 dark:fill-neutral-500" font-size="9">{{ tick }}</text>

    <path
      *ngFor="let s of series"
      [attr.d]="pathFor(s)"
      fill="none" [attr.stroke]="s.color"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <ng-container *ngFor="let s of series">
      <circle
        *ngFor="let v of s.values; let i = index"
        [attr.cx]="xFor(i)" [attr.cy]="yFor(v)" r="3.5"
        [attr.fill]="s.color" stroke-width="2" class="stroke-white dark:stroke-neutral-900" />
    </ng-container>

    <text
      *ngFor="let s of series"
      [attr.x]="xFor(labels.length - 1) + 6" [attr.y]="yFor(s.values[s.values.length - 1]) + 3"
      class="fill-anthracite text-[9px] font-semibold dark:fill-white">{{ s.values[s.values.length - 1] }}</text>

    <line
      *ngIf="hoverIndex !== null"
      [attr.x1]="crosshairX" [attr.x2]="crosshairX"
      [attr.y1]="paddingTop" [attr.y2]="height - paddingBottom"
      class="stroke-gray-300 dark:stroke-neutral-700" stroke-width="1" />

    <text
      *ngFor="let label of labels; let i = index"
      [attr.x]="xFor(i)" [attr.y]="height - 6"
      text-anchor="middle" class="fill-gray-400 dark:fill-neutral-500" font-size="9">{{ label }}</text>
  </svg>

  <div
    *ngIf="hoverIndex !== null"
    class="pointer-events-none absolute top-1 z-10 -translate-x-1/2 rounded-md border border-gray-200 bg-white px-3 py-2 text-xs shadow-lg dark:border-neutral-700 dark:bg-neutral-900"
    [style.left.%]="tooltipLeftPercent">
    <p class="mb-1 font-medium text-anthracite dark:text-white">{{ labels[hoverIndex] }}</p>
    <p *ngFor="let s of series" class="flex items-center gap-1.5 text-gray-600 dark:text-neutral-300">
      <span class="inline-block h-0.5 w-3 shrink-0 rounded-full" [style.background]="s.color"></span>
      <span class="font-semibold text-anthracite dark:text-white">{{ s.values[hoverIndex] }}</span>
      {{ s.name }}
    </p>
  </div>
</div>

<div class="mt-3 flex flex-wrap gap-4 text-xs text-gray-600 dark:text-neutral-400">
  <span *ngFor="let s of series" class="flex items-center gap-1.5">
    <span class="inline-block h-0.5 w-4 shrink-0 rounded-full" [style.background]="s.color"></span>
    {{ s.name }}
  </span>
</div>

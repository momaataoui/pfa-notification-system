<div class="flex items-center gap-6">
  <svg [attr.viewBox]="'0 0 ' + size + ' ' + size" [attr.width]="size" [attr.height]="size" class="shrink-0">
    <g [attr.transform]="'rotate(-90 ' + size / 2 + ' ' + size / 2 + ')'">
      <circle
        *ngFor="let seg of segments; let i = index"
        [attr.cx]="size / 2" [attr.cy]="size / 2" [attr.r]="radius"
        fill="none" [attr.stroke]="seg.color" [attr.stroke-width]="strokeWidth"
        [attr.stroke-dasharray]="dashArrayFor(seg)"
        [attr.stroke-dashoffset]="offsetFor(i)">
        <title>{{ seg.label }} : {{ percentFor(seg) }}% ({{ seg.value }})</title>
      </circle>
    </g>
  </svg>

  <div class="flex flex-col gap-2 text-sm">
    <div *ngFor="let seg of segments" class="flex items-center gap-2">
      <span class="h-2.5 w-2.5 shrink-0 rounded-full" [style.background]="seg.color"></span>
      <span class="text-anthracite dark:text-white">{{ seg.label }}</span>
      <span class="text-gray-500 dark:text-neutral-400">{{ percentFor(seg) }}% ({{ seg.value }})</span>
    </div>
  </div>
</div>

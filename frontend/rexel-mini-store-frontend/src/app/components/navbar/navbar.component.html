<nav class="sticky top-0 z-50 flex flex-wrap items-center justify-between gap-4 border-b border-gray-200 bg-white px-4 py-3 dark:border-neutral-800 dark:bg-black sm:px-6 md:px-10">
  <a [routerLink]="isAdmin ? '/admin' : '/'" class="flex items-center gap-3">
    <app-logo-mark [size]="36"></app-logo-mark>
    <span class="text-lg font-bold tracking-tight text-anthracite dark:text-white">
      REXEL <span class="text-rexel">MINI</span>
    </span>
  </a>

  <div *ngIf="!isAdmin" class="order-3 flex items-center gap-6 text-sm font-medium text-anthracite dark:text-white md:order-none">
    <a routerLink="/products" class="hover:text-rexel">Products</a>
    <a routerLink="/" class="hidden hover:text-rexel sm:inline">About</a>
    <a routerLink="/" class="hidden hover:text-rexel sm:inline">Contact</a>
  </div>

  <div class="flex flex-1 items-center justify-end gap-4 md:flex-none">
    <div *ngIf="!isAdmin" class="hidden min-w-0 flex-1 md:flex md:w-64 md:flex-none">
      <input
        type="text"
        placeholder="Search products..."
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearchSubmit()"
        class="w-full rounded-md border border-gray-300 bg-gray-50 px-3 py-2 text-sm text-anthracite placeholder-gray-400 focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white dark:placeholder-neutral-500" />
    </div>

    <button
      type="button"
      (click)="themeService.toggleTheme()"
      class="text-gray-500 hover:text-anthracite dark:text-white dark:hover:text-neutral-300"
      aria-label="Changer de theme">
      <svg *ngIf="(themeService.theme$ | async) === 'dark'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
        <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z" clip-rule="evenodd" />
      </svg>
      <svg *ngIf="(themeService.theme$ | async) === 'light'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
        <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z" />
      </svg>
    </button>

    <a *ngIf="!isAdmin" routerLink="/my-orders" class="relative text-gray-500 hover:text-anthracite dark:text-white dark:hover:text-neutral-300" aria-label="Mes commandes">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
        <path d="M2.25 2.25a.75.75 0 000 1.5h1.386c.17 0 .318.114.362.278l2.558 9.592a3.752 3.752 0 00-2.806 3.63c0 .414.336.75.75.75h15.75a.75.75 0 000-1.5H5.378A2.25 2.25 0 017.5 15h11.218a.75.75 0 00.73-.579l1.5-6.5a.75.75 0 00-.73-.921H6.156L5.5 4.278A1.875 1.875 0 003.636 2.25H2.25z" />
        <path d="M8.25 21a1.125 1.125 0 100-2.25 1.125 1.125 0 000 2.25zM18.75 21a1.125 1.125 0 100-2.25 1.125 1.125 0 000 2.25z" />
      </svg>
    </a>

    <div *ngIf="currentUser" class="relative">
      <button
        type="button"
        (click)="onNotificationIconClick()"
        class="relative text-gray-500 hover:text-anthracite dark:text-white dark:hover:text-neutral-300"
        aria-label="Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
          <path fill-rule="evenodd" d="M5.25 9a6.75 6.75 0 0113.5 0v.75c0 2.123.8 4.057 2.118 5.52a.75.75 0 01-.297 1.206c-1.544.57-3.16.99-4.831 1.243a3.75 3.75 0 11-7.48 0 24.585 24.585 0 01-4.831-1.244.75.75 0 01-.298-1.205A8.217 8.217 0 005.25 9.75V9zm4.502 8.9a2.25 2.25 0 104.496 0 25.057 25.057 0 01-4.496 0z" clip-rule="evenodd" />
        </svg>
        <span
          *ngIf="(notificationStore.unreadCount$ | async) as unreadCount"
          class="absolute -right-1.5 -top-1.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-semibold text-white">
          {{ unreadCount }}
        </span>
      </button>

      <div
        *ngIf="notifMenuOpen"
        class="absolute right-0 z-50 mt-2 w-96 max-w-[90vw] overflow-hidden rounded-xl border border-gray-200 bg-white shadow-xl dark:border-neutral-800 dark:bg-neutral-900">

        <div class="px-4 pt-4 pb-3">
          <p class="text-base font-semibold text-anthracite dark:text-white">Notifications</p>
        </div>

        <div class="px-4 pb-3">
          <div class="flex gap-1 rounded-lg bg-gray-100 p-1 dark:bg-neutral-800">
            <button
              type="button"
              (click)="setNotifFilter('all')"
              class="flex-1 rounded-md px-3 py-1.5 text-xs font-medium transition-colors"
              [class.bg-white]="currentNotifFilter === 'all'"
              [class.shadow-sm]="currentNotifFilter === 'all'"
              [class.text-anthracite]="currentNotifFilter === 'all'"
              [class.dark:bg-neutral-700]="currentNotifFilter === 'all'"
              [class.dark:text-white]="currentNotifFilter === 'all'"
              [class.text-gray-500]="currentNotifFilter !== 'all'"
              [class.dark:text-neutral-400]="currentNotifFilter !== 'all'">
              Toutes
            </button>
            <button
              type="button"
              (click)="setNotifFilter('unread')"
              class="flex flex-1 items-center justify-center gap-2 rounded-md px-3 py-1.5 text-xs font-medium transition-colors"
              [class.bg-white]="currentNotifFilter === 'unread'"
              [class.shadow-sm]="currentNotifFilter === 'unread'"
              [class.text-anthracite]="currentNotifFilter === 'unread'"
              [class.dark:bg-neutral-700]="currentNotifFilter === 'unread'"
              [class.dark:text-white]="currentNotifFilter === 'unread'"
              [class.text-gray-500]="currentNotifFilter !== 'unread'"
              [class.dark:text-neutral-400]="currentNotifFilter !== 'unread'">
              Non lues
              <span
                *ngIf="(notificationStore.unreadCount$ | async) as unreadCount"
                class="flex h-4 min-w-4 items-center justify-center rounded-full bg-rexel px-1 text-[10px] font-semibold text-white">
                {{ unreadCount }}
              </span>
            </button>
          </div>
        </div>

        <div class="max-h-80 overflow-y-auto">
          <p
            *ngIf="(filteredNotifications$ | async)?.length === 0"
            class="px-4 py-8 text-center text-sm text-gray-500 dark:text-neutral-500">
            {{ currentNotifFilter === 'unread' ? 'Aucune notification non lue.' : 'Aucune notification.' }}
          </p>

          <button
            *ngFor="let notification of filteredNotifications$ | async"
            type="button"
            (click)="onNotificationClick(notification)"
            class="flex w-full items-start gap-3 px-4 py-3 text-left hover:bg-gray-50 dark:hover:bg-neutral-800"
            [ngClass]="notificationRowClass(notification)">
            <span
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full"
              [ngClass]="priorityAvatarClass(notification.priority)">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4">
                <path fill-rule="evenodd" d="M5.25 9a6.75 6.75 0 0113.5 0v.75c0 2.123.8 4.057 2.118 5.52a.75.75 0 01-.297 1.206c-1.544.57-3.16.99-4.831 1.243a3.75 3.75 0 11-7.48 0 24.585 24.585 0 01-4.831-1.244.75.75 0 01-.298-1.205A8.217 8.217 0 005.25 9.75V9zm4.502 8.9a2.25 2.25 0 104.496 0 25.057 25.057 0 01-4.496 0z" clip-rule="evenodd" />
              </svg>
            </span>

            <span class="min-w-0 flex-1">
              <span class="block truncate text-sm font-medium text-anthracite dark:text-white">{{ notification.title }}</span>
              <span class="block truncate text-xs text-gray-500 dark:text-neutral-400">{{ notification.message }}</span>
              <span class="mt-0.5 block text-[11px] text-gray-400 dark:text-neutral-500">{{ timeAgo(notification.createdAt) }}</span>
            </span>

            <span *ngIf="!notification.read" class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-rexel"></span>
          </button>
        </div>

        <div class="flex gap-2 border-t border-gray-100 p-3 dark:border-neutral-800">
          <button
            type="button"
            (click)="markAllAsRead()"
            class="flex-1 rounded-md border border-gray-300 px-3 py-2 text-xs font-semibold text-anthracite hover:bg-gray-50 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800">
            Tout marquer comme lu
          </button>
          <button
            type="button"
            (click)="notifMenuOpen = false"
            class="flex-1 rounded-md bg-rexel px-3 py-2 text-xs font-semibold text-white hover:bg-rexel-dark">
            Fermer
          </button>
        </div>
      </div>
    </div>

    <ng-container *ngIf="currentUser; else loggedOut">
      <div class="relative">
        <button type="button" (click)="onProfileIconClick()" class="flex items-center gap-3">
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-rexel text-sm font-semibold text-white">
            {{ initials }}
          </span>
          <span class="hidden text-sm font-medium text-anthracite dark:text-white sm:inline">
            {{ currentUser.firstName }} {{ currentUser.lastName }}
          </span>
        </button>

        <div
          *ngIf="menuOpen"
          (click)="menuOpen = false"
          class="absolute right-0 z-50 mt-2 w-48 rounded-md border border-gray-200 bg-white py-2 shadow-lg dark:border-neutral-800 dark:bg-neutral-900">
          <a routerLink="/profile" class="block px-4 py-2 text-sm text-anthracite hover:bg-gray-50 dark:text-white dark:hover:bg-neutral-800">Mon profil</a>
          <a *ngIf="!isAdmin" routerLink="/my-orders" class="block px-4 py-2 text-sm text-anthracite hover:bg-gray-50 dark:text-white dark:hover:bg-neutral-800">Mes commandes</a>
          <a *ngIf="isAdmin" routerLink="/admin" class="block px-4 py-2 text-sm text-anthracite hover:bg-gray-50 dark:text-white dark:hover:bg-neutral-800">Espace admin</a>
          <button type="button" (click)="logout()" class="block w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-gray-50 dark:text-red-400 dark:hover:bg-neutral-800">
            Deconnexion
          </button>
        </div>
      </div>
    </ng-container>

    <ng-template #loggedOut>
      <button
        type="button"
        (click)="authService.register()"
        class="hidden text-sm font-medium text-anthracite hover:text-rexel dark:text-white sm:inline">
        Inscription
      </button>
      <button
        type="button"
        (click)="authService.requestLogin()"
        class="rounded-md border border-rexel px-4 py-2 text-sm font-semibold text-rexel hover:bg-blue-50 dark:hover:bg-neutral-900">
        Se connecter
      </button>
    </ng-template>
  </div>
</nav>

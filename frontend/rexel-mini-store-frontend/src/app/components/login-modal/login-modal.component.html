<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" (click)="close.emit()">
  <div class="w-90 max-w-[90vw] rounded-lg bg-white p-7 dark:border dark:border-neutral-800 dark:bg-neutral-950" (click)="$event.stopPropagation()">
    <h2 class="mb-1 text-lg font-semibold text-anthracite dark:text-white">Connexion</h2>
    <p class="mb-5 text-sm text-gray-500 dark:text-neutral-400">Compte de demonstration : mohammed&#64;rexel.com / password123</p>

    <div *ngIf="errorMessage" class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-2 text-sm text-red-700 dark:border-red-900 dark:bg-red-950/40 dark:text-red-400">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="submit()" class="flex flex-col gap-4">
      <label class="text-sm text-gray-600 dark:text-neutral-400">
        Email
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
      </label>
      <label class="text-sm text-gray-600 dark:text-neutral-400">
        Mot de passe
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
      </label>

      <div class="mt-2 flex justify-end gap-3">
        <button type="button" (click)="close.emit()" class="rounded-md border border-gray-300 px-4 py-2 text-sm text-anthracite hover:bg-gray-50 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800">
          Annuler
        </button>
        <button type="submit" class="rounded-md bg-rexel px-4 py-2 text-sm font-semibold text-white hover:bg-rexel-dark">
          Se connecter
        </button>
      </div>
    </form>
  </div>
</div>

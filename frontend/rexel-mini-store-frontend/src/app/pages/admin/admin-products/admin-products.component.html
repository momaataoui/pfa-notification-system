<div class="mb-6 flex items-center justify-between">
  <h1 class="text-2xl font-bold text-anthracite dark:text-white">Produits</h1>
  <button
    type="button"
    (click)="openCreateForm()"
    class="rounded-md bg-rexel px-4 py-2 text-sm font-semibold text-white hover:bg-rexel-dark">
    + Ajouter un produit
  </button>
</div>

<app-spinner *ngIf="loading"></app-spinner>

<div *ngIf="!loading && products.length === 0" class="py-16 text-center text-gray-400 dark:text-neutral-500">
  Aucun produit pour le moment.
</div>

<div *ngIf="!loading && products.length > 0" class="overflow-x-auto rounded-lg border border-gray-200 dark:border-neutral-800">
  <table class="w-full text-left text-sm">
    <thead class="bg-gray-50 text-gray-500 dark:bg-neutral-900 dark:text-neutral-400">
      <tr>
        <th class="px-4 py-3"></th>
        <th class="px-4 py-3">Nom</th>
        <th class="px-4 py-3">Prix</th>
        <th class="px-4 py-3">Stock</th>
        <th class="px-4 py-3"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of pagedProducts" class="border-t border-gray-100 dark:border-neutral-800">
        <td class="px-4 py-2">
          <img [src]="product.imageUrl || getProductIcon(product.name)" [alt]="product.name" class="h-10 w-10 rounded object-cover" />
        </td>
        <td class="px-4 py-3 text-anthracite dark:text-white">{{ product.name }}</td>
        <td class="px-4 py-3 text-anthracite dark:text-white">{{ product.price }} DH</td>
        <td class="px-4 py-3 text-anthracite dark:text-white">{{ product.stockQuantity }}</td>
        <td class="px-4 py-3 text-right">
          <button type="button" (click)="openEditForm(product)" class="mr-2 text-sm font-medium text-rexel hover:underline">
            Modifier
          </button>
          <button type="button" (click)="askDelete(product)" class="text-sm font-medium text-red-600 hover:underline dark:text-red-400">
            Supprimer
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="!loading && totalPages > 1" class="mt-6 flex items-center justify-center gap-2">
  <button type="button" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1" class="rounded-md border border-gray-300 px-3 py-1.5 text-sm text-anthracite disabled:opacity-40 dark:border-neutral-700 dark:text-white">&#8592;</button>
  <span class="text-sm text-gray-500 dark:text-neutral-400">Page {{ currentPage }} / {{ totalPages }}</span>
  <button type="button" (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages" class="rounded-md border border-gray-300 px-3 py-1.5 text-sm text-anthracite disabled:opacity-40 dark:border-neutral-700 dark:text-white">&#8594;</button>
</div>

<div *ngIf="showForm" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" (click)="closeForm()">
  <div class="w-96 max-w-[90vw] rounded-lg bg-white p-7 dark:border dark:border-neutral-800 dark:bg-neutral-950" (click)="$event.stopPropagation()">
    <h2 class="mb-4 text-lg font-semibold text-anthracite dark:text-white">
      {{ editingProduct ? 'Modifier le produit' : 'Ajouter un produit' }}
    </h2>

    <form [formGroup]="form" (ngSubmit)="submitForm()" class="flex flex-col gap-3">
      <label class="text-sm text-gray-600 dark:text-neutral-400">
        Nom
        <input type="text" formControlName="name" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
      </label>
      <label class="text-sm text-gray-600 dark:text-neutral-400">
        Description
        <textarea formControlName="description" rows="2" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white"></textarea>
      </label>
      <label class="text-sm text-gray-600 dark:text-neutral-400">
        Prix (DH)
        <input type="number" step="0.01" formControlName="price" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
      </label>
      <label class="text-sm text-gray-600 dark:text-neutral-400">
        Prix barre (optionnel)
        <input type="number" step="0.01" formControlName="originalPrice" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
      </label>
      <label class="text-sm text-gray-600 dark:text-neutral-400">
        Stock
        <input type="number" formControlName="stockQuantity" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
      </label>
      <label class="text-sm text-gray-600 dark:text-neutral-400">
        Categorie
        <input type="text" formControlName="category" placeholder="Breakers, Cables, Lighting..." class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
      </label>
      <label class="text-sm text-gray-600 dark:text-neutral-400">
        URL image (optionnel)
        <input type="text" formControlName="imageUrl" placeholder="https://..." class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
      </label>

      <div class="mt-2 flex justify-end gap-3">
        <button type="button" (click)="closeForm()" class="rounded-md border border-gray-300 px-4 py-2 text-sm text-anthracite hover:bg-gray-50 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800">
          Annuler
        </button>
        <button type="submit" [disabled]="saving" class="rounded-md bg-rexel px-4 py-2 text-sm font-semibold text-white hover:bg-rexel-dark disabled:opacity-60">
          {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>

<app-confirm-dialog
  *ngIf="productToDelete"
  title="Supprimer le produit"
  [message]="'Etes-vous sur de vouloir supprimer ' + productToDelete.name + ' ?'"
  (confirm)="confirmDelete()"
  (cancel)="productToDelete = null">
</app-confirm-dialog>

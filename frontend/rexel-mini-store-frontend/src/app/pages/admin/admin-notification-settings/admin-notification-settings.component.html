<div class="mb-6 flex items-center gap-2">
  <h1 class="text-2xl font-bold text-anthracite dark:text-white">Paramètres des notifications</h1>
  <span class="rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-500 dark:bg-neutral-800 dark:text-neutral-400">
    Aperçu
  </span>
</div>

<form [formGroup]="form" (ngSubmit)="save()" class="flex max-w-xl flex-col gap-6 rounded-lg border border-gray-200 bg-white p-6 shadow-sm dark:border-neutral-800 dark:bg-neutral-950">

  <div>
    <p class="mb-3 text-sm font-semibold text-anthracite dark:text-white">Canaux actifs</p>
    <div class="flex flex-col gap-3">
      <label class="flex items-center justify-between text-sm text-gray-600 dark:text-neutral-400">
        Push
        <input type="checkbox" formControlName="pushEnabled" class="h-4 w-4 accent-rexel" />
      </label>
      <label class="flex items-center justify-between text-sm text-gray-600 dark:text-neutral-400">
        Email
        <input type="checkbox" formControlName="emailEnabled" class="h-4 w-4 accent-rexel" />
      </label>
      <label class="flex items-center justify-between text-sm text-gray-600 dark:text-neutral-400">
        SMS
        <input type="checkbox" formControlName="smsEnabled" class="h-4 w-4 accent-rexel" />
      </label>
    </div>
  </div>

  <label class="text-sm text-gray-600 dark:text-neutral-400">
    Seuil d'alerte stock faible (unités)
    <input
      type="number"
      formControlName="lowStockThreshold"
      class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
  </label>

  <label class="text-sm text-gray-600 dark:text-neutral-400">
    Frequence des resumes email
    <select
      formControlName="digestFrequency"
      class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white">
      <option value="instant">Instantane</option>
      <option value="daily">Resume quotidien</option>
      <option value="weekly">Resume hebdomadaire</option>
    </select>
  </label>

  <div>
    <button type="submit" class="rounded-md bg-rexel px-4 py-2 text-sm font-semibold text-white hover:bg-rexel-dark">
      Enregistrer
    </button>
  </div>
</form>

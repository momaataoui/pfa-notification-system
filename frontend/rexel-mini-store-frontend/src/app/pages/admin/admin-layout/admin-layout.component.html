<div class="flex flex-col md:flex-row">
  <aside class="w-full shrink-0 bg-[#0b1530] md:w-60 md:min-h-[calc(100vh-73px)]">
    <p class="hidden px-4 pt-5 pb-2 text-xs font-semibold uppercase tracking-wider text-white/40 md:block">
      Administration
    </p>
    <nav class="flex gap-2 overflow-x-auto p-4 md:flex-col md:overflow-visible md:pt-2">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="bg-rexel text-white"
        class="flex items-center gap-3 whitespace-nowrap rounded-md px-3 py-2.5 text-sm font-medium text-white/70 hover:bg-white/10 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 shrink-0">
          <path d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
        </svg>
        Dashboard
      </a>
      <a
        routerLink="/admin/products"
        routerLinkActive="bg-rexel text-white"
        class="flex items-center gap-3 whitespace-nowrap rounded-md px-3 py-2.5 text-sm font-medium text-white/70 hover:bg-white/10 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 shrink-0">
          <path fill-rule="evenodd" d="M11.622 1.602a.75.75 0 01.756 0l8.25 4.723a.75.75 0 010 1.302l-8.25 4.723a.75.75 0 01-.756 0L3.372 7.627a.75.75 0 010-1.302l8.25-4.723zM3.372 12.373a.75.75 0 011.023-.276l7.605 4.234 7.605-4.234a.75.75 0 11.729 1.313l-7.94 4.416a.75.75 0 01-.729 0l-7.94-4.416a.75.75 0 01-.353-1.037zm0 4.5a.75.75 0 011.023-.276l7.605 4.234 7.605-4.234a.75.75 0 11.729 1.313l-7.94 4.416a.75.75 0 01-.729 0l-7.94-4.416a.75.75 0 01-.353-1.037z" clip-rule="evenodd" />
        </svg>
        Produits
      </a>
      <a
        routerLink="/admin/orders"
        routerLinkActive="bg-rexel text-white"
        class="flex items-center gap-3 whitespace-nowrap rounded-md px-3 py-2.5 text-sm font-medium text-white/70 hover:bg-white/10 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 shrink-0">
          <path d="M2.25 2.25a.75.75 0 000 1.5h1.386c.17 0 .318.114.362.278l2.558 9.592a3.752 3.752 0 00-2.806 3.63c0 .414.336.75.75.75h15.75a.75.75 0 000-1.5H5.378A2.25 2.25 0 017.5 15h11.218a.75.75 0 00.73-.579l1.5-6.5a.75.75 0 00-.73-.921H6.156L5.5 4.278A1.875 1.875 0 003.636 2.25H2.25z" />
          <path d="M8.25 21a1.125 1.125 0 100-2.25 1.125 1.125 0 000 2.25zM18.75 21a1.125 1.125 0 100-2.25 1.125 1.125 0 000 2.25z" />
        </svg>
        <span class="flex-1">Commandes</span>
        <span
          *ngIf="unreadOrderCount > 0"
          class="flex h-5 min-w-5 items-center justify-center rounded-full bg-red-500 px-1.5 text-[11px] font-semibold text-white">
          {{ unreadOrderCount }}
        </span>
      </a>
      <a
        routerLink="/admin/customers"
        routerLinkActive="bg-rexel text-white"
        class="flex items-center gap-3 whitespace-nowrap rounded-md px-3 py-2.5 text-sm font-medium text-white/70 hover:bg-white/10 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 shrink-0">
          <path d="M4.5 6.375a4.125 4.125 0 118.25 0 4.125 4.125 0 01-8.25 0zM14.25 8.625a3.375 3.375 0 116.75 0 3.375 3.375 0 01-6.75 0zM1.5 19.125a7.125 7.125 0 0114.25 0v.003l-.001.119a.75.75 0 01-.363.63 13.067 13.067 0 01-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 01-.364-.63l-.001-.122zM17.25 19.128l-.001.144a2.25 2.25 0 01-.233.96 10.088 10.088 0 005.06-1.01.75.75 0 00.42-.643 4.875 4.875 0 00-6.957-4.611 8.586 8.586 0 011.71 5.157v.003z" />
        </svg>
        Clients
      </a>
      <a
        routerLink="/admin/product-requests"
        routerLinkActive="bg-rexel text-white"
        class="flex items-center gap-3 whitespace-nowrap rounded-md px-3 py-2.5 text-sm font-medium text-white/70 hover:bg-white/10 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 shrink-0">
          <path fill-rule="evenodd" d="M3.792 2.938A49.069 49.069 0 0112 2.25c2.797 0 5.54.236 8.209.688a1.857 1.857 0 011.541 1.836v1.044a3 3 0 01-.879 2.121l-6.182 6.182a1.5 1.5 0 00-.439 1.061v2.927a3 3 0 01-1.658 2.684l-1.757.878A.75.75 0 019.75 21v-6.775a1.5 1.5 0 00-.44-1.06L3.13 6.982a3 3 0 01-.879-2.121V3.816a1.857 1.857 0 011.542-1.878z" clip-rule="evenodd" />
        </svg>
        <span class="flex-1">Demandes</span>
        <span
          *ngIf="pendingProductRequestCount > 0"
          class="flex h-5 min-w-5 items-center justify-center rounded-full bg-red-500 px-1.5 text-[11px] font-semibold text-white">
          {{ pendingProductRequestCount }}
        </span>
      </a>
      <button
        type="button"
        (click)="toggleNotifMenu()"
        class="flex items-center gap-3 whitespace-nowrap rounded-md px-3 py-2.5 text-sm font-medium text-white/70 hover:bg-white/10 hover:text-white"
        [class.text-white]="notifExpanded">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 shrink-0 text-rexel">
          <path fill-rule="evenodd" d="M5.25 9a6.75 6.75 0 0113.5 0v.75c0 2.123.8 4.057 2.118 5.52a.75.75 0 01-.297 1.206c-1.544.57-3.16.99-4.831 1.243a3.75 3.75 0 11-7.48 0 24.585 24.585 0 01-4.831-1.244.75.75 0 01-.298-1.205A8.217 8.217 0 005.25 9.75V9zm4.502 8.9a2.25 2.25 0 104.496 0 25.057 25.057 0 01-4.496 0z" clip-rule="evenodd" />
        </svg>
        <span class="flex-1 text-left">Notifications</span>
        <svg
          xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
          class="h-4 w-4 shrink-0 transition-transform" [class.rotate-180]="notifExpanded">
          <path fill-rule="evenodd" d="M12.53 16.28a.75.75 0 01-1.06 0l-7.5-7.5a.75.75 0 011.06-1.06L12 14.69l6.97-6.97a.75.75 0 111.06 1.06l-7.5 7.5z" clip-rule="evenodd" />
        </svg>
      </button>

      <div *ngIf="notifExpanded" class="ml-4 flex flex-col gap-1 border-l border-white/10 pl-4 md:mb-1">
        <a
          routerLink="/admin/dashboard"
          routerLinkActive="text-white font-medium"
          class="rounded-md px-3 py-2 text-sm text-white/60 hover:bg-white/10 hover:text-white">
          Tableau de bord
        </a>
        <a
          routerLink="/admin/notifications"
          routerLinkActive="text-white font-medium"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-md px-3 py-2 text-sm text-white/60 hover:bg-white/10 hover:text-white">
          Envoyer
        </a>
        <a
          routerLink="/admin/notifications/history"
          routerLinkActive="text-white font-medium"
          class="rounded-md px-3 py-2 text-sm text-white/60 hover:bg-white/10 hover:text-white">
          Historique
        </a>
        <a
          routerLink="/admin/notifications/stats"
          routerLinkActive="text-white font-medium"
          class="rounded-md px-3 py-2 text-sm text-white/60 hover:bg-white/10 hover:text-white">
          Statistiques
        </a>
        <a
          routerLink="/admin/notifications/failures"
          routerLinkActive="text-white font-medium"
          class="rounded-md px-3 py-2 text-sm text-white/60 hover:bg-white/10 hover:text-white">
          Échecs
        </a>
        <a
          routerLink="/admin/notifications/settings"
          routerLinkActive="text-white font-medium"
          class="rounded-md px-3 py-2 text-sm text-white/60 hover:bg-white/10 hover:text-white">
          Paramètres
        </a>
      </div>
    </nav>
  </aside>

  <div class="min-w-0 flex-1 bg-gray-50 px-4 py-8 dark:bg-black sm:px-6 md:px-10">
    <router-outlet></router-outlet>
  </div>
</div>

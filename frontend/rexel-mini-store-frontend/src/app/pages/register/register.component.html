<div class="mx-auto max-w-md px-4 py-16">
  <h1 class="mb-1 text-2xl font-bold text-anthracite dark:text-white">Creer un compte</h1>
  <p class="mb-8 text-sm text-gray-500 dark:text-neutral-400">Rejoignez REXEL MINI pour commander vos composants electriques.</p>

  <div *ngIf="errorMessage" class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-2 text-sm text-red-700 dark:border-red-900 dark:bg-red-950/40 dark:text-red-400">
    {{ errorMessage }}
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <label class="text-sm text-gray-600 dark:text-neutral-400">
      Prenom
      <input
        type="text"
        formControlName="firstName"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
      <span *ngIf="form.controls.firstName.invalid && form.controls.firstName.touched" class="text-xs text-red-600 dark:text-red-400">
        Le prenom est requis.
      </span>
    </label>

    <label class="text-sm text-gray-600 dark:text-neutral-400">
      Nom
      <input
        type="text"
        formControlName="lastName"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
      <span *ngIf="form.controls.lastName.invalid && form.controls.lastName.touched" class="text-xs text-red-600 dark:text-red-400">
        Le nom est requis.
      </span>
    </label>

    <label class="text-sm text-gray-600 dark:text-neutral-400">
      Email
      <input
        type="email"
        formControlName="email"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
      <span *ngIf="form.controls.email.invalid && form.controls.email.touched" class="text-xs text-red-600 dark:text-red-400">
        Email invalide.
      </span>
    </label>

    <label class="text-sm text-gray-600 dark:text-neutral-400">
      Telephone
      <input
        type="tel"
        formControlName="phone"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
      <span *ngIf="form.controls.phone.invalid && form.controls.phone.touched" class="text-xs text-red-600 dark:text-red-400">
        Le telephone est requis.
      </span>
    </label>

    <label class="text-sm text-gray-600 dark:text-neutral-400">
      Mot de passe
      <input
        type="password"
        formControlName="password"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
      <span *ngIf="form.controls.password.invalid && form.controls.password.touched" class="text-xs text-red-600 dark:text-red-400">
        6 caracteres minimum.
      </span>
    </label>

    <button
      type="submit"
      [disabled]="submitting"
      class="mt-2 rounded-md bg-rexel px-4 py-2.5 text-sm font-semibold text-white hover:bg-rexel-dark disabled:opacity-60">
      {{ submitting ? 'Creation...' : 'Creer mon compte' }}
    </button>

    <p class="text-center text-sm text-gray-500 dark:text-neutral-400">
      Deja un compte ? <a routerLink="/" class="font-medium text-rexel">Se connecter</a>
    </p>
  </form>
</div>

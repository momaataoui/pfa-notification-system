<div class="px-4 py-8 sm:px-6 md:px-10">
  <h1 class="mb-6 text-2xl font-bold text-anthracite dark:text-white">Mes commandes</h1>

  <app-spinner *ngIf="loading"></app-spinner>

  <div *ngIf="!loading && orders.length === 0" class="py-16 text-center text-gray-400 dark:text-neutral-500">
    Vous n'avez pas encore passe de commande.
  </div>

  <div *ngIf="!loading && orders.length > 0" class="overflow-x-auto rounded-lg border border-gray-200 dark:border-neutral-800">
    <table class="w-full text-left text-sm">
      <thead class="bg-gray-50 text-gray-500 dark:bg-neutral-900 dark:text-neutral-400">
        <tr>
          <th class="px-4 py-3">Numero</th>
          <th class="px-4 py-3">Produit</th>
          <th class="px-4 py-3">Quantite</th>
          <th class="px-4 py-3">Prix total</th>
          <th class="px-4 py-3">Date</th>
          <th class="px-4 py-3">Statut</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of pagedOrders" class="border-t border-gray-100 dark:border-neutral-800">
          <td class="px-4 py-3 text-anthracite dark:text-white">#{{ order.id }}</td>
          <td class="px-4 py-3 text-anthracite dark:text-white">{{ order.product.name }}</td>
          <td class="px-4 py-3 text-anthracite dark:text-white">{{ order.quantity }}</td>
          <td class="px-4 py-3 text-anthracite dark:text-white">{{ order.totalAmount }} DH</td>
          <td class="px-4 py-3 text-gray-500 dark:text-neutral-400">{{ order.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
          <td class="px-4 py-3"><app-status-badge [status]="order.status"></app-status-badge></td>
          <td class="px-4 py-3">
            <div *ngIf="order.status === 'PENDING'" class="flex gap-2">
              <button
                type="button"
                (click)="askCancel(order)"
                class="rounded-md border border-red-300 px-3 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50 dark:border-red-900 dark:text-red-400 dark:hover:bg-red-950/40">
                Annuler
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading && totalPages > 1" class="mt-6 flex items-center justify-center gap-2">
    <button
      type="button"
      (click)="goToPage(currentPage - 1)"
      [disabled]="currentPage === 1"
      class="rounded-md border border-gray-300 px-3 py-1.5 text-sm text-anthracite disabled:opacity-40 dark:border-neutral-700 dark:text-white">
      &#8592;
    </button>
    <span class="text-sm text-gray-500 dark:text-neutral-400">Page {{ currentPage }} / {{ totalPages }}</span>
    <button
      type="button"
      (click)="goToPage(currentPage + 1)"
      [disabled]="currentPage === totalPages"
      class="rounded-md border border-gray-300 px-3 py-1.5 text-sm text-anthracite disabled:opacity-40 dark:border-neutral-700 dark:text-white">
      &#8594;
    </button>
  </div>
</div>

<app-confirm-dialog
  *ngIf="orderToCancel"
  title="Annuler la commande"
  [message]="'Etes-vous sur de vouloir annuler la commande #' + orderToCancel.id + ' ?'"
  (confirm)="confirmCancel()"
  (cancel)="orderToCancel = null">
</app-confirm-dialog>

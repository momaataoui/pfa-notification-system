<div class="mx-auto max-w-md px-4 py-16">
  <h1 class="mb-8 text-2xl font-bold text-anthracite dark:text-white">Mon profil</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <label class="text-sm text-gray-600 dark:text-neutral-400">
      Prenom
      <input
        type="text"
        formControlName="firstName"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
    </label>

    <label class="text-sm text-gray-600 dark:text-neutral-400">
      Nom
      <input
        type="text"
        formControlName="lastName"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
    </label>

    <label class="text-sm text-gray-600 dark:text-neutral-400">
      Email
      <input
        type="email"
        formControlName="email"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
    </label>

    <label class="text-sm text-gray-600 dark:text-neutral-400">
      Telephone
      <input
        type="tel"
        formControlName="phone"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-anthracite focus:border-rexel focus:outline-none dark:border-neutral-700 dark:bg-neutral-900 dark:text-white" />
    </label>

    <button
      type="submit"
      [disabled]="saving"
      class="mt-2 rounded-md bg-rexel px-4 py-2.5 text-sm font-semibold text-white hover:bg-rexel-dark disabled:opacity-60">
      {{ saving ? 'Enregistrement...' : 'Enregistrer les modifications' }}
    </button>
  </form>
</div>

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
data:
  01-create-rexel-store.sql: "CREATE DATABASE rexel_store;"
  02-create-keycloak.sql: "CREATE DATABASE keycloak;"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              value: pfa
            - name: POSTGRES_DB
              value: pfa_notifications
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: POSTGRES_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
        - name: init-scripts
          configMap: { name: postgres-init-scripts }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]

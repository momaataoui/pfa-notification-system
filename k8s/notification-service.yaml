apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/pfa_notifications" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092" }
            - { name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI, value: "http://keycloak:8080/realms/rexel-realm/protocol/openid-connect/certs" }
            - name: GMAIL_USERNAME
              valueFrom: { secretKeyRef: { name: pfa-secrets, key: GMAIL_USERNAME } }
            - name: GMAIL_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: pfa-secrets, key: GMAIL_APP_PASSWORD } }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector: { app: notification-service }
  ports: [{ port: 8080 }]

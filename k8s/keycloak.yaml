apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          args: ["start-dev"]
          ports: [{ containerPort: 8080 }]
          env:
            - { name: KEYCLOAK_ADMIN, value: "admin" }
            - { name: KEYCLOAK_ADMIN_PASSWORD, value: "admin" }
            - { name: KC_DB, value: "postgres" }
            - { name: KC_DB_URL, value: "jdbc:postgresql://postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: "pfa" }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pfa-secrets, key: POSTGRES_PASSWORD }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app: keycloak }
  ports: [{ port: 8080 }]
